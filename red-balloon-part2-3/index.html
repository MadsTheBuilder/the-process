    <script>
      // ---------- palette + seeded PRNG (deterministic) — same system as Part 1 ----------
      const C = {
        ink: "#ece4d4", skin: "#d8c6ad", crowd: "#3b4354", crowdFar: "#2b303b", dark: "#101216",
        rust: "#d0583c", amber: "#f0ae4e", blue: "#3f74e8", cool: "#86a6dc", tube: "#bfe0d4",
        father: "#b9cbe4", mother: "#e7d9bf", sister: "#d2703d", vendor: "#e6ddc6", host: "#8a7f63", khaki: "#a88f5c", cap: "#5e4f30",
      };
      const TYPE = { WIDE: "#86a6dc", MEDIUM: "#f0ae4e", CLOSE: "#e36a4c" };
      const SEQ = [
        { n: "SEQ 7 · THE CHOWKI DOOR", s: "7 · THE CHOWKI DOOR", c: "#86a6dc" },
        { n: "SEQ 8 · THE WIRELESS", s: "8 · THE WIRELESS", c: "#f0ae4e" },
        { n: "SEQ 9 · GOLDEN HOURS (NARRATOR)", s: "9 · GOLDEN HOURS + POWER METER", c: "#9aa0a8" },
        { n: "SEQ 10 · REACTION → PLAN", s: "10 · REACTION → PLAN (MELA CHOWKI)", c: "#8fc0a9" },
        { n: "SEQ 11 · THE DUTY DESK", s: "11 · THE DUTY DESK (PART 3)", c: "#d0583c" },
        { n: "SEQ 12 · RANK ≠ POST", s: "12 · RANK IS NOT THE JOB", c: "#c98bd0" },
      ];
      // header scene slug + part label per sequence
      const SCN = ["SC.03 · EXT. MELA CHOWKI ENTRANCE · NIGHT 19:20", "SC.03 · EXT. MELA CHOWKI / MELA GROUND · NIGHT 19:20",
        "SC.03 · INT. NARRATOR SET · OUTSIDE STORY TIME", "SC.04 · INT. MELA CHOWKI · NIGHT, BEFORE 20:00",
        "SC.05 · INT. POLICE STATION DUTY DESK · NIGHT 20:00", "SC.06 · INT. DUTY DESK / SHO OFFICE THRESHOLD · 20:15–20:45"];
      const PART = ["PART 2 — GROUND · GHANTA 00:20", "PART 2 — GROUND · GHANTA 00:20", "PART 2 — GROUND · GHANTA 00:20",
        "PART 2 — GROUND · GHANTA 00:20", "PART 3 — PROCESS · GHANTA 01:00", "PART 3 — PROCESS · GHANTA 01:00"].map((p) => p + " · ANIMATIC STORYBOARD v1");
      function prng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const W = 1216, H = 684;
      const f1 = (n) => Math.round(n * 10) / 10;

      // ---------- SVG primitives (Part 1 set + police/interior additions) ----------
      const defs = `<defs>
        <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c30"/><stop offset=".65" stop-color="#34436a"/><stop offset="1" stop-color="#6d5a5a"/></linearGradient>
        <linearGradient id="dust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3025"/><stop offset="1" stop-color="#6e5838"/></linearGradient>
        <radialGradient id="warm" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#ffcf7a"/><stop offset=".45" stop-color="#b86e2a"/><stop offset="1" stop-color="#2a1b10"/></radialGradient>
        <linearGradient id="coolR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b2a4a" stop-opacity="0"/><stop offset="1" stop-color="#1b2a4a" stop-opacity=".62"/></linearGradient>
        <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b979" stop-opacity="0"/><stop offset=".5" stop-color="#e9b979" stop-opacity=".16"/><stop offset="1" stop-color="#e9b979" stop-opacity="0"/></linearGradient>
        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset=".7" stop-color="#1a2238"/><stop offset="1" stop-color="#3a3036"/></linearGradient>
        <radialGradient id="bgclose" cx=".45" cy=".4" r=".9"><stop offset="0" stop-color="#3a2c22"/><stop offset="1" stop-color="#101218"/></radialGradient>
        <radialGradient id="bgthana" cx=".35" cy=".35" r=".95"><stop offset="0" stop-color="#4a4c44"/><stop offset="1" stop-color="#15171a"/></radialGradient>
        <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
        <linearGradient id="doorIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e8e2"/><stop offset="1" stop-color="#7d8f88"/></linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="bok" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
        <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.amber}"/></marker>
        <marker id="ahC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.cool}"/></marker>
        <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.rust}"/></marker>
        <marker id="ahI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.ink}"/></marker>
        <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.tube}"/></marker>
      </defs>`;

      function label(x, y, t, o = {}) {
        const fs = o.fs || 14, w = t.length * fs * 0.62 + 14, col = o.c === C.rust ? "#ee7d60" : o.c || C.ink;
        return `<g ${o.id ? `id="${o.id}"` : ""} ${o.cls ? `class="${o.cls}"` : ""} opacity="${o.op ?? 1}"><rect x="${f1(x - w / 2)}" y="${f1(y - fs - 3)}" width="${f1(w)}" height="${fs + 9}" fill="rgba(8,9,11,.8)"/>` +
          `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" font-size="${fs}" font-weight="700" letter-spacing="1.2" fill="${col}">${t}</text>` +
          (o.u ? `<rect x="${f1(x - w / 2 + 7)}" y="${f1(y + 3)}" width="${f1(w - 14)}" height="2.5" fill="${C.rust}"/>` : "") + `</g>`;
      }
      // stick figure (book board language). Added: cap (police beret), bun, belt, sit (seated: value = floor y), keyc (key colour)
      function fig(x, gy, h, o = {}) {
        const r = h * 0.085, hy = gy - h + r, sh = gy - h * 0.79, hip = gy - h * 0.44;
        const sw = h * 0.13, hw = h * 0.095, lw = Math.max(1.6, h * 0.03);
        const limb = o.c || C.crowd, torso = o.jacket || limb, head = o.head || limb;
        const d = o.face === "l" ? -1 : o.face === "r" ? 1 : 0;
        let s = `<g ${o.id ? `id="${o.id}"` : ""} opacity="${o.op ?? 1}" ${o.filter ? `filter="url(#${o.filter})"` : ""}>`;
        if (o.sit) {
          const k = d || 1, kx = x + k * h * 0.22, fy = o.sit;
          s += `<polyline points="${f1(x - hw * 0.45)},${f1(hip)} ${f1(kx - hw * 0.4)},${f1(hip + lw)} ${f1(kx - hw * 0.2)},${f1(fy)}" fill="none" stroke="${limb}" stroke-width="${f1(lw * 1.7)}" stroke-linecap="round" stroke-linejoin="round"/>`;
          s += `<polyline points="${f1(x + hw * 0.45)},${f1(hip)} ${f1(kx + hw * 0.4)},${f1(hip + lw)} ${f1(kx + hw * 0.5)},${f1(fy)}" fill="none" stroke="${limb}" stroke-width="${f1(lw * 1.7)}" stroke-linecap="round" stroke-linejoin="round"/>`;
        } else {
          s += `<line x1="${f1(x - hw * 0.45)}" y1="${f1(hip)}" x2="${f1(x - hw * 0.75)}" y2="${f1(gy)}" stroke="${limb}" stroke-width="${f1(lw * 1.7)}" stroke-linecap="round"/>`;
          s += `<line x1="${f1(x + hw * 0.45)}" y1="${f1(hip)}" x2="${f1(x + hw * 0.75)}" y2="${f1(gy)}" stroke="${limb}" stroke-width="${f1(lw * 1.7)}" stroke-linecap="round"/>`;
        }
        const armL = `<line x1="${f1(x - sw)}" y1="${f1(sh + lw)}" x2="${f1(x - sw - h * 0.05)}" y2="${f1(hip + h * 0.02)}" stroke="${limb}" stroke-width="${f1(lw * 1.3)}" stroke-linecap="round"/>`;
        const armR = `<line x1="${f1(x + sw)}" y1="${f1(sh + lw)}" x2="${f1(x + sw + h * 0.05)}" y2="${f1(hip + h * 0.02)}" stroke="${limb}" stroke-width="${f1(lw * 1.3)}" stroke-linecap="round"/>`;
        s += o.armL || armL;
        s += o.armR || armR;
        s += `<polygon points="${f1(x - sw)},${f1(sh)} ${f1(x + sw)},${f1(sh)} ${f1(x + hw)},${f1(hip)} ${f1(x - hw)},${f1(hip)}" fill="${torso}"/>`;
        if (o.belt) s += `<rect x="${f1(x - hw * 1.02)}" y="${f1(hip - h * 0.045)}" width="${f1(hw * 2.04)}" height="${f1(h * 0.035)}" fill="#3a2a1a"/>`;
        if (o.stripe) s += `<line x1="${f1(x)}" y1="${f1(sh)}" x2="${f1(x)}" y2="${f1(hip)}" stroke="#dfe6f5" stroke-width="${f1(lw * 0.5)}"/>`;
