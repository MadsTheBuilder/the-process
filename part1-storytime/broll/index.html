      // ---------- palette + seeded PRNG (deterministic) ----------
      const C = {

        rust: "#d0583c", amber: "#f0ae4e", blue: "#3f74e8", cool: "#86a6dc",
        father: "#b9cbe4", mother: "#e7d9bf", sister: "#d2703d", vendor: "#e6ddc6", host: "#8a7f63", khaki: "#a88f5c",
      };
      const TYPE = { WIDE: "#86a6dc", MEDIUM: "#f0ae4e", CLOSE: "#e36a4c" };
      const SEQ = [
        { n: "SEQ 0 · MIRZAPUR", s: "0", c: "#ece4d4" },
        { n: "SEQ 1 · THE MELA", s: "1 · MELA", c: "#86a6dc" },
        { n: "SEQ 2 · THE GUPTA FAMILY", s: "2 · FAMILY", c: "#f0ae4e" },
        { n: "SEQ 3 · THE ZID & THE SLIP", s: "3 · THE SLIP", c: "#d0583c" },
        { n: "SEQ 4 · THE SEARCH", s: "4 · THE SEARCH", c: "#8fc0a9" },
        { n: "SEQ 5 · THE WITNESS", s: "5 · THE WITNESS", c: "#c98bd0" },
        { n: "SEQ 6 · THE LADDER (NARRATOR)", s: "6 · THE LADDER (NARRATOR)", c: "#9aa0a8" },
      ];
      // header scene slug per sequence
      const SCN = ["SC.01 · MIRZAPUR DISTRICT → MELA", "SC.01 · EXT. MIRZAPUR MELA / STALL LANE · EVENING 19:00", "SC.01 · EXT. MIRZAPUR MELA / STALL LANE · EVENING 19:00",
        "SC.01 · EXT. MIRZAPUR MELA / STALL LANE · EVENING 19:00", "SC.01 · EXT. MIRZAPUR MELA / STALL LANE · 19:10", "SC.02 · EXT. BALLOON SELLER · NIGHT 19:15",
        "SC.02 · INT. NARRATOR SET · OUTSIDE STORY TIME"];
      function prng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const W = 1216, H = 684;
      const f1 = (n) => Math.round(n * 10) / 10;

      // ---------- SVG primitives ----------
      const defs = `<defs>
        <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c30"/><stop offset=".65" stop-color="#34436a"/><stop offset="1" stop-color="#6d5a5a"/></linearGradient>
        <linearGradient id="dust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3025"/><stop offset="1" stop-color="#6e5838"/></linearGradient>
        <radialGradient id="warm" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#ffcf7a"/><stop offset=".45" stop-color="#b86e2a"/><stop offset="1" stop-color="#2a1b10"/></radialGradient>
        <linearGradient id="coolR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b2a4a" stop-opacity="0"/><stop offset="1" stop-color="#1b2a4a" stop-opacity=".62"/></linearGradient>

        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset=".7" stop-color="#1a2238"/><stop offset="1" stop-color="#3a3036"/></linearGradient>
        <radialGradient id="bgclose" cx=".45" cy=".4" r=".9"><stop offset="0" stop-color="#3a2c22"/><stop offset="1" stop-color="#101218"/></radialGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="bok" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
        <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.amber}"/></marker>
        <marker id="ahC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.cool}"/></marker>
        <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.rust}"/></marker>
        <marker id="ahI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.ink}"/></marker>
      </defs>`;

      const CLEAN = true;
      const ghost = (id) => (id ? `<g id="${id}" opacity="0"></g>` : "");
      function label(x, y, t, o = {}) {
        if (CLEAN && !o.keep) return ghost(o.id);
        const fs = o.fs || 14, w = t.length * fs * 0.62 + 14, col = o.c === C.rust ? "#ee7d60" : o.c || C.ink;
        return `<g ${o.id ? `id="${o.id}"` : ""} opacity="${o.op ?? 1}"><rect x="${f1(x - w / 2)}" y="${f1(y - fs - 3)}" width="${f1(w)}" height="${fs + 9}" fill="rgba(8,9,11,.8)"/>` +
          `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" font-size="${fs}" font-weight="700" letter-spacing="1.2" fill="${col}">${t}</text>` +
          (o.u ? `<rect x="${f1(x - w / 2 + 7)}" y="${f1(y + 3)}" width="${f1(w - 14)}" height="2.5" fill="${C.rust}"/>` : "") + `</g>`;
      }
      // stick figure (book board language: round head, trapezoid torso, line limbs, nose shows facing)
      function fig(x, gy, h, o = {}) {
        const r = h * 0.085, hy = gy - h + r, sh = gy - h * 0.79, hip = gy - h * 0.44;
        const sw = h * 0.13, hw = h * 0.095, lw = Math.max(1.6, h * 0.03);
        const limb = o.c || C.crowd, torso = o.jacket || limb, head = o.head || limb;
        const d = o.face === "l" ? -1 : o.face === "r" ? 1 : 0;
        let s = `<g ${o.id ? `id="${o.id}"` : ""} opacity="${o.op ?? 1}" ${o.filter ? `filter="url(#${o.filter})"` : ""}>`;
        s += `<line x1="${f1(x - hw * 0.45)}" y1="${f1(hip)}" x2="${f1(x - hw * 0.75)}" y2="${f1(gy)}" stroke="${limb}" stroke-width="${f1(lw * 1.7)}" stroke-linecap="round"/>`;
        s += `<line x1="${f1(x + hw * 0.45)}" y1="${f1(hip)}" x2="${f1(x + hw * 0.75)}" y2="${f1(gy)}" stroke="${limb}" stroke-width="${f1(lw * 1.7)}" stroke-linecap="round"/>`;
        const armL = `<line x1="${f1(x - sw)}" y1="${f1(sh + lw)}" x2="${f1(x - sw - h * 0.05)}" y2="${f1(hip + h * 0.02)}" stroke="${limb}" stroke-width="${f1(lw * 1.3)}" stroke-linecap="round"/>`;
        const armR = `<line x1="${f1(x + sw)}" y1="${f1(sh + lw)}" x2="${f1(x + sw + h * 0.05)}" y2="${f1(hip + h * 0.02)}" stroke="${limb}" stroke-width="${f1(lw * 1.3)}" stroke-linecap="round"/>`;
        s += o.armL || armL;
        s += o.armR || armR;
        s += `<polygon points="${f1(x - sw)},${f1(sh)} ${f1(x + sw)},${f1(sh)} ${f1(x + hw)},${f1(hip)} ${f1(x - hw)},${f1(hip)}" fill="${torso}"/>`;
        if (o.stripe) s += `<line x1="${f1(x)}" y1="${f1(sh)}" x2="${f1(x)}" y2="${f1(hip)}" stroke="#dfe6f5" stroke-width="${f1(lw * 0.5)}"/>`;
        if (o.sari) s += `<line x1="${f1(x - sw)}" y1="${f1(sh)}" x2="${f1(x + hw)}" y2="${f1(hip)}" stroke="${C.rust}" stroke-width="${f1(lw * 1.2)}"/>`;
        if (o.gamchha) {
          const p = `M${f1(x - sw * 0.45)} ${f1(sh)} L${f1(x - hw * 0.7)} ${f1(hip - h * 0.06)} M${f1(x + sw * 0.45)} ${f1(sh)} L${f1(x + hw * 0.7)} ${f1(hip - h * 0.06)}`;
          s += `<path d="${p}" stroke="#f1ece0" stroke-width="${f1(lw * 1.6)}"/><path d="${p}" stroke="${C.rust}" stroke-width="${f1(lw * 1.6)}" stroke-dasharray="${f1(lw * 1.2)} ${f1(lw * 1.2)}"/>`;
        }
        s += `<rect x="${f1(x - r * 0.35)}" y="${f1(hy + r * 0.8)}" width="${f1(r * 0.7)}" height="${f1(sh - hy - r * 0.6)}" fill="${head}"/>`;
        s += `<circle cx="${f1(x)}" cy="${f1(hy)}" r="${f1(r)}" fill="${head}"/>`;
        if (d) s += `<polygon points="${f1(x + d * r * 0.95)},${f1(hy - r * 0.2)} ${f1(x + d * r * 1.35)},${f1(hy + r * 0.05)} ${f1(x + d * r * 0.95)},${f1(hy + r * 0.3)}" fill="${head}"/>`;
        if (o.key && !CLEAN) s += `<path d="M${f1(x - r * 0.7)} ${f1(hy - r * 0.7)} A${f1(r)} ${f1(r)} 0 0 0 ${f1(x - r * 0.7)} ${f1(hy + r * 0.7)}" fill="none" stroke="${C.amber}" stroke-width="${f1(Math.max(1.5, r * 0.18))}" opacity=".9"/>`;
        if (o.ring && !CLEAN) s += `<circle cx="${f1(x)}" cy="${f1(hy)}" r="${f1(r * 1.55)}" fill="none" stroke="${C.rust}" stroke-width="2.5"/>`;
        if (o.label) s += label(x, gy + 24, o.label, { u: true, fs: o.lfs || 14 });
        return s + `</g>`;

      // head + shoulders for close-ups

        const col = o.c || C.dark, head = o.head || col, bot = H + 40;
        const hr = s * 0.42, hy = by - s * 0.98, d = o.face === "l" ? -1 : o.face === "r" ? 1 : 0;
        let g = `<g ${o.id ? `id="${o.id}"` : ""} opacity="${o.op ?? 1}" ${o.filter ? `filter="url(#${o.filter})"` : ""}>`;
        g += `<path d="M${f1(x - s * 1.05)} ${bot} L${f1(x - s * 0.92)} ${f1(by - s * 0.02)} Q${f1(x - s * 0.85)} ${f1(by - s * 0.3)} ${f1(x - s * 0.3)} ${f1(by - s * 0.36)} L${f1(x + s * 0.3)} ${f1(by - s * 0.36)} Q${f1(x + s * 0.85)} ${f1(by - s * 0.3)} ${f1(x + s * 0.92)} ${f1(by - s * 0.02)} L${f1(x + s * 1.05)} ${bot} Z" fill="${col}"/>`;
        if (o.jacket) {

      function planSvg(p) {
        const cx = 125, cy = 150, len = 118, a = (p.fov / 2) * Math.PI / 180;
        const lx = cx - Math.sin(a) * len, rx = cx + Math.sin(a) * len, ty = cy - Math.cos(a) * len;
        let s = `<svg viewBox="0 0 250 172" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pm${p.fov}${p.move}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${C.ink}"/></marker></defs>`;
        s += `<text x="10" y="18" font-size="11" letter-spacing="1.5" fill="#9aa0a8" font-weight="700">CAMERA PLAN · TOP-DOWN</text>`;
        s += `<rect x="95" y="26" width="60" height="140" fill="#2a2219"/>`;
        s += `<polygon points="${cx},${cy} ${f1(lx)},${f1(ty)} ${f1(rx)},${f1(ty)}" fill="${C.cool}" opacity=".16" stroke="${C.cool}" stroke-opacity=".6"/>`;
        s += `<rect x="${cx - 9}" y="${cy - 6}" width="18" height="14" fill="${C.ink}"/><polygon points="${cx - 5},${cy - 6} ${cx + 5},${cy - 6} ${cx + 8},${cy - 13} ${cx - 8},${cy - 13}" fill="${C.ink}"/>`;
        p.subj.forEach((sj, i) => {
          const n = p.subj.length, x = cx - (n - 1) * 13 + i * 26, y = 72;
          s += `<circle cx="${x}" cy="${y}" r="10" fill="${sj[1]}"/><text x="${x}" y="${y + 4}" font-size="11" text-anchor="middle" font-weight="800" fill="#0c0d0f">${sj[0]}</text>`;
        });
        s += `<circle cx="24" cy="58" r="8" fill="${C.amber}"/><line x1="34" y1="62" x2="70" y2="74" stroke="${C.amber}" stroke-width="2"/><text x="12" y="44" font-size="10" fill="${C.amber}" font-weight="700">KEY</text>`;
        const mk = `marker-end="url(#pm${p.fov}${p.move})"`;
        if (p.move === "drift") s += `<line x1="150" y1="${cy + 4}" x2="205" y2="${cy + 4}" stroke="${C.ink}" stroke-width="2" ${mk}/><text x="160" y="${cy - 6}" font-size="10" fill="${C.ink}">DRIFT</text>`;
        if (p.move === "push") s += `<line x1="160" y1="${cy + 4}" x2="160" y2="${cy - 26}" stroke="${C.ink}" stroke-width="2" ${mk}/><text x="170" y="${cy - 10}" font-size="10" fill="${C.ink}">PUSH</text>`;
        if (p.move === "back") s += `<line x1="160" y1="${cy - 26}" x2="160" y2="${cy + 6}" stroke="${C.ink}" stroke-width="2" ${mk}/><text x="170" y="${cy - 10}" font-size="10" fill="${C.ink}">DOLLY BACK</text>`;
        if (p.move === "static") s += `<text x="160" y="${cy - 2}" font-size="10" fill="${C.ink}">LOCKED OFF</text>`;
        if (p.high) s += `<text x="160" y="${cy + 16}" font-size="10" fill="${C.amber}">HIGH ANGLE</text>`;
        return s + `<text x="10" y="166" font-size="10" fill="${C.cool}">${p.fov}° HFOV</text></svg>`;
      }
      const fmt = (t) => { const d = Math.round(t * 10), s = Math.floor(d / 10); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}.${d % 10}`; };

      // shot starts come from the durations; the static <section> timings must agree (fails loud if not)
      let acc = 0;
      for (const sh of SHOTS) {
        sh.start = acc; acc = Math.round((acc + sh.dur) * 100) / 100;
        const el = document.getElementById(sh.id);
        if (!el || Math.abs(+el.dataset.start - sh.start) > 0.001 || Math.abs(+el.dataset.duration - sh.dur) > 0.001) throw new Error(`#${sh.id} section timing out of sync with SHOTS`);
      }
      const TOTAL = acc;
      if (Math.abs(+document.getElementById("root").dataset.duration - TOTAL) > 0.001) throw new Error("#root duration out of sync with SHOTS");
      const A = Object.fromEntries(SHOTS.map((s) => [s.id, s.start])), D = Object.fromEntries(SHOTS.map((s) => [s.id, s.dur]));

      for (const sh of SHOTS) {
        const el = document.getElementById(sh.id), sq = SEQ[sh.seq], tcol = TYPE[sh.type];

          `<div class="panel"><div class="cam" id="${sh.id}-cam">${scenes[sh.id]()}</div>` +
          `<div class="corner mono" style="color:${tcol}">SHOT ${sh.k} · ${sh.type}</div>` +

          `<h2>${sh.title}</h2><div class="tcr mono">${fmt(sh.start)} → ${fmt(sh.start + sh.dur)} · ${sh.dur.toFixed(1)}s · ${sh.inT || "HARD CUT IN"}</div>` +
          `<div class="rows"><div class="row"><div class="lb">CAMERA</div><div class="v">${sh.cam}</div></div>` +

      const PX = 1824 / TOTAL;
      let strip = `<div class="seqrow">`;

      }
      strip += `</div><div class="playhead" id="playhead"></div>`;
      document.getElementById("strip").innerHTML = strip;

      // ---------- timeline (every tween is placed relative to its shot: A.id + offset) ----------
      const tl = gsap.timeline({ paused: true });
      const tc = document.getElementById("tc"), scn = document.getElementById("scn");
      let lastSeq = -1;
      tl.fromTo("#playhead", { x: 0 }, { x: 1821, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo({ t: 0 }, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate() {
        const t = this.targets()[0].t, sh = SHOTS.findLast((s) => s.start <= t + 1e-6);
        tc.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
        if (sh.seq !== lastSeq) { lastSeq = sh.seq; scn.textContent = SCN[sh.seq]; }
      } }, 0);
      for (const sh of SHOTS) {
        tl.fromTo(`#on-${sh.id}`, { opacity: 0 }, { opacity: 1, duration: 0.15 }, sh.start);
        tl.to(`#on-${sh.id}`, { opacity: 0, duration: 0.15 }, sh.start + sh.dur - 0.05);
        // side card + VO settle in on every cut
        tl.from(`#${sh.id} .side .row`, { opacity: 0, x: 18, duration: 0.3, stagger: 0.04, ease: "power2.out" }, sh.start + 0.05);
        tl.from(`#${sh.id} .vo .txt`, { opacity: 0, y: 10, duration: 0.3, ease: "power2.out" }, sh.start + 0.05);
        if (document.getElementById(sh.id).querySelector(".draw")) tl.from(`#${sh.id} .draw`, { opacity: 0, duration: 0.35 }, sh.start + 0.25);
      }
      const bulbsIn = (id) => {
        const n = Math.max(0, Math.floor(D[id] / 0.6) - 1);
        tl.to(`#${id} .bulb`, { opacity: 0.55, duration: 0.3, stagger: { each: 0.02, from: "random" }, yoyo: true, repeat: n, ease: "sine.inOut" }, A[id]);
      };
      const bob = (sel, t0, dur, amp, per) => tl.fromTo(sel, { y: 0 }, { y: -amp, duration: per, yoyo: true, repeat: Math.max(1, Math.round(dur / per) - 1), ease: "sine.inOut" }, t0);
